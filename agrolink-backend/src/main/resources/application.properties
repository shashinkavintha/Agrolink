# Project Metadata
spring.application.name=agrolink-backend
server.port=8080

# --- Database Configuration (Supabase) ---
# Use port 5432 for direct session connection if 6543 (pooler) continues to limit you
spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.ufmhxrfopuaqmzbeqfxe
spring.datasource.password=Shashin1234#
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hikari Connection Pool Settings ---
# These settings prevent the "FATAL: Max client connections reached" error
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# --- Hibernate / JPA ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Improves startup time by not validating every single table at once
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

